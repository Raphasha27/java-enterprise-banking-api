<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Enterprise Banking API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 800px; padding: 40px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 16px; color: #f0f6fc; }
        .badge { display: inline-block; padding: 4px 12px; margin: 4px; border-radius: 16px; font-size: 0.85rem; font-weight: 600; }
        .badge-lang { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb; }
        .desc { font-size: 1.2rem; color: #8b949e; margin: 24px 0; line-height: 1.6; }
        .tech { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 24px 0; }
        .tech span { background: #21262d; padding: 6px 14px; border-radius: 6px; font-size: 0.9rem; color: #c9d1d9; border: 1px solid #30363d; }
        .links { margin-top: 32px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .links a { display: inline-block; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #238636; color: #fff; border: 1px solid #2ea043; }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-secondary:hover { background: #30363d; }
        .footer { margin-top: 48px; color: #484f58; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Java Enterprise Banking API</h1>
        <div><span class="badge badge-lang">Java</span></div>
        <p class="desc">Enterprise-grade banking API with Spring Boot, JWT authentication, and PostgreSQL</p>
        <div class="tech"><span>Spring Boot</span><span>JWT</span><span>PostgreSQL</span><span>Redis</span><span>Flyway</span></div>
        <div class="links">
            <a href="https://github.com/Raphasha27/java-enterprise-banking-api" class="btn-primary">View on GitHub</a>
            <a href="https://hub.docker.com/r/raphasha27/java-enterprise-banking-api" class="btn-secondary">Docker Hub</a>
        </div>
        <p class="footer">Built by Koketso Raphasha | raphashakoketso69@gmail.com</p>
    </div>
</body>
</html>
